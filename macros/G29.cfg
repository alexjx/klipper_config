[gcode_macro G29]
gcode:
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
description: Safely calibrate a native Klipper adaptive or full bed mesh
gcode:
    # The fixed bed probe is blocked while a tool is mounted.
    {% if printer['toollock'].tool_current | int >= 0 %}
        { action_raise_error('could not probe if there is a tool mounted') }
    {% endif %}
    CHECK_TOOL state="unmounted"

    {% if "xyz" != printer.toolhead.homed_axes %}
        { action_raise_error('not enough axis homed') }
    {% endif %}

    {% set adaptive_mesh = printer["gcode_macro _SETTINGS"].adaptive_mesh | int %}
    {% if adaptive_mesh %}
        # Klipper derives bounds and probe count from [exclude_object]. The
        # default 3mm margin comes from settings/bed_mesh.cfg; callers may
        # override it with ADAPTIVE_MARGIN.
        _BED_MESH_CALIBRATE {rawparams} ADAPTIVE=1
    {% else %}
        _BED_MESH_CALIBRATE {rawparams}
    {% endif %}

[gcode_macro MANUAL_BED_CALIBRATE]
gcode:
    # Manual bed calibration requires an empty tool mount.
    {% if printer['toollock'].tool_current | int >= 0 %}
        DROP_TOOL
    {% endif %}
    CHECK_TOOL state="unmounted"

    {% if "xyz" != printer.toolhead.homed_axes %}
        G28
    {% else %}
        G28 Z
    {% endif %}

    {% set bed_mesh_min = printer.configfile.settings.bed_mesh.mesh_min %}
    {% set bed_mesh_max = printer.configfile.settings.bed_mesh.mesh_max %}

    BED_MESH_CLEAR
    _BED_MESH_CALIBRATE mesh_min={bed_mesh_min[0]},{bed_mesh_min[1]} mesh_max={bed_mesh_max[0]},{bed_mesh_max[1]} ALGORITHM=bicubic PROBE_COUNT=3,3

[gcode_macro _MANUAL_BED_PROBE_POINT]
description: Internal helper to probe one fixed bed adjustment point
variable_point_fl: [10.0, 20.0]
variable_point_fr: [290.0, 20.0]
variable_point_br: [290.0, 180.0]
variable_point_bl: [10.0, 180.0]
variable_safe_z: 5.0
variable_lift_z: 5.0
variable_xy_speed: 18000
variable_z_speed: 360
gcode:
    {% set point = params.POINT|default("")|upper %}
    {% set points = {
        "FL": point_fl,
        "FR": point_fr,
        "BR": point_br,
        "BL": point_bl
    } %}

    {% if point not in points %}
        { action_raise_error("POINT must be FL, FR, BR, or BL") }
    {% endif %}

    {% if printer['toollock'].tool_current | int >= 0 %}
        DROP_TOOL
    {% endif %}

    {% if printer['toollock'].changer_mode|string != "IDLE" %}
        { action_raise_error("Tool changer must be idle") }
    {% endif %}

    {% set xy = points[point] %}

    CHECK_TOOL state="unmounted"
    _CG28
    BED_MESH_CLEAR

    SAVE_GCODE_STATE NAME=manual_bed_probe_point
    G90
    G0 Z{ safe_z } F{ z_speed }
    G0 X{ xy[0] } Y{ xy[1] } F{ xy_speed }
    PROBE
    G91
    G0 Z{ lift_z } F{ z_speed }
    M400
    RESTORE_GCODE_STATE NAME=manual_bed_probe_point

    RESPOND PREFIX="" MSG="Measured manual bed point { point } at X={ xy[0] }, Y={ xy[1] }"
