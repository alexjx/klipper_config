[gcode_macro DRY_FILAMENT]
description: Dry filament on the heated bed (TEMP=110, HOURS=12)

variable_target_temp: 0
variable_stage: "idle" # idle -> heating -> drying -> complete/cancelled/interrupted/heat_timeout
variable_check_interval: 30
variable_heat_timeout: 3600
variable_drying_z: 200
variable_dry_time_remaining: 0
variable_total_time_elapsed: 0

gcode:
    {% set target_temp = params.TEMP | default(110) | float %}
    {% set duration_hours = params.HOURS | default(12) | float %}
    {% set duration = duration_hours * 60 * 60 %}
    {% set dryer = printer["gcode_macro DRY_FILAMENT"] %}
    {% set print_state = printer.print_stats.state | lower %}

    {% if target_temp < 40 or target_temp > 120 %}
        { action_raise_error("DRY_FILAMENT: TEMP must be between 40 and 120C") }
    {% elif duration_hours < 1 or duration_hours > 12 %}
        { action_raise_error("DRY_FILAMENT: HOURS must be between 1 and 12") }
    {% elif dryer.stage in ("heating", "drying") %}
        { action_raise_error("DRY_FILAMENT: a dryer cycle is already active") }
    {% elif print_state in ("printing", "paused") %}
        { action_raise_error("DRY_FILAMENT: cannot start while a print is active") }
    {% elif printer.toollock.tool_current | int >= 0 %}
        { action_raise_error("DRY_FILAMENT: drop the mounted tool before starting") }
    {% else %}
        # Start from a known-safe heater state, then prepare the drying space.
        TURN_OFF_HEATERS
        G28
        G90
        G1 Z{ dryer.drying_z } F1200
        M400
        M84

        SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=target_temp VALUE={ target_temp }
        SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=stage VALUE="'heating'"
        SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=dry_time_remaining VALUE={ duration }
        SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=total_time_elapsed VALUE=0

        # Motor release is complete before the bed heater is enabled.
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={ target_temp }
        UPDATE_DELAYED_GCODE ID=filament_dryer DURATION=1

        M117 Dryer heating bed to { "%.0f" | format(target_temp) }C
        RESPOND PREFIX="DRYER" MSG="Heating bed to { '%.0f' | format(target_temp) }C; the { '%.1f' | format(duration_hours) } hour timer starts at temperature"
    {% endif %}

[gcode_macro CANCEL_FILAMENT_DRYER]
description: Cancel an active DRY_FILAMENT cycle and turn off the bed
gcode:
    {% set dryer = printer["gcode_macro DRY_FILAMENT"] %}
    {% if dryer.stage in ("heating", "drying") %}
        _STOP_FILAMENT_DRYER REASON=cancelled
    {% else %}
        RESPOND PREFIX="DRYER" MSG="No dryer cycle is active"
    {% endif %}

[gcode_macro _STOP_FILAMENT_DRYER]
gcode:
    {% set dryer = printer["gcode_macro DRY_FILAMENT"] %}
    {% set reason = params.REASON | default("cancelled") | lower %}
    {% set keep_bed = params.KEEP_BED | default(0) | int %}

    UPDATE_DELAYED_GCODE ID=filament_dryer DURATION=0
    {% if not keep_bed %}
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    {% endif %}

    SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=target_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=stage VALUE="'{ reason }'"
    SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=dry_time_remaining VALUE=0
    SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=total_time_elapsed VALUE=0

    {% if reason == "complete" %}
        M117 Filament drying complete
        RESPOND PREFIX="DRYER" MSG="Drying complete; heated bed turned off"
    {% elif reason == "heat_timeout" %}
        M117 Dryer stopped: heat timeout
        RESPOND TYPE=error MSG="DRYER: Bed did not reach drying temperature within 60 minutes; heated bed turned off"
    {% elif reason == "interrupted" %}
        M117 Dryer monitoring stopped
        RESPOND TYPE=error MSG="DRYER: Bed target changed externally; dryer timer stopped without changing the new bed target"
    {% else %}
        M117 Filament drying cancelled
        RESPOND PREFIX="DRYER" MSG="Drying cancelled; heated bed turned off"
    {% endif %}

[delayed_gcode filament_dryer]
gcode:
    {% set dryer = printer["gcode_macro DRY_FILAMENT"] %}
    {% set stage = dryer.stage %}
    {% set elapsed = dryer.total_time_elapsed + dryer.check_interval %}
    {% set remaining = dryer.dry_time_remaining %}

    {% if stage not in ("heating", "drying") %}
        UPDATE_DELAYED_GCODE ID=filament_dryer DURATION=0
    {% elif (printer.heater_bed.target - dryer.target_temp) | abs > 0.1 %}
        # A print, M140/M190, or TURN_OFF_HEATERS has taken ownership of the bed.
        _STOP_FILAMENT_DRYER REASON=interrupted KEEP_BED=1
    {% elif stage == "heating" and printer.heater_bed.temperature >= dryer.target_temp - 2 %}
        SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=stage VALUE="'drying'"
        SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=total_time_elapsed VALUE={ elapsed }
        M117 Dryer started: { "%.1f" | format(remaining / 3600) }h remaining
        RESPOND PREFIX="DRYER" MSG="Bed is at temperature; drying timer started"
        # Match HEAT_SOAK: a tiny dwell records activity without changing idle_timeout.
        G4 P1
        UPDATE_DELAYED_GCODE ID=filament_dryer DURATION={ dryer.check_interval }
    {% elif stage == "heating" and elapsed >= dryer.heat_timeout %}
        _STOP_FILAMENT_DRYER REASON=heat_timeout
    {% else %}
        {% if stage == "drying" %}
            {% set remaining = [remaining - dryer.check_interval, 0] | max %}
            SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=dry_time_remaining VALUE={ remaining }
        {% endif %}
        SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=total_time_elapsed VALUE={ elapsed }

        {% if stage == "drying" and remaining == 0 %}
            _STOP_FILAMENT_DRYER REASON=complete
        {% else %}
            {% if elapsed % 1800 == 0 %}
                {% if stage == "heating" %}
                    M117 Dryer heating: { "%.0f" | format(printer.heater_bed.temperature) }/{ "%.0f" | format(dryer.target_temp) }C
                {% else %}
                    M117 Dryer: { "%.1f" | format(remaining / 3600) }h remaining
                {% endif %}
            {% endif %}
            # Match HEAT_SOAK: a tiny dwell records activity without changing idle_timeout.
            G4 P1
            UPDATE_DELAYED_GCODE ID=filament_dryer DURATION={ dryer.check_interval }
        {% endif %}
    {% endif %}
