[gcode_macro _FILAMENT_SETTINGS]
description: Per-tool filament-path defaults during staged toolboard migration
variable_load_lengths: [890.0, 890.0, 80.0, 80.0]
variable_unload_lengths: [1000.0, 1000.0, 200.0, 200.0]
variable_max_move_lengths: [1000.0, 1000.0, 250.0, 250.0]
variable_entry_length: 15.0
variable_purge_length: 50.0
variable_load_speed: 5.0
variable_unload_speed: 20.0
variable_cold_pull_speed: 10.0
variable_slow_speed: 1.0
gcode:

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from the selected tool
gcode:
    {% set filament = printer["gcode_macro _FILAMENT_SETTINGS"] %}
    {% set TOOL = params.TOOL|default(printer.toollock.tool_current)|int %}
    {% if TOOL < 0 or TOOL > 3 %}
        { action_raise_error("TOOL must be 0, 1, 2, or 3") }
    {% endif %}
    {% if ("tool " ~ TOOL) not in printer %}
        { action_raise_error("The selected tool is not connected and enabled") }
    {% endif %}
    {% set TEMP = params.TEMP|default(0)|int %}
    {% set max_move_length = filament.max_move_lengths[TOOL]|float %}
    {% set unload_length = params.LENGTH|default(filament.unload_lengths[TOOL])|float %}
    {% set unload_speed = params.SPEED|default(filament.unload_speed)|float %}
    {% if unload_length <= 0 or unload_length > max_move_length or unload_speed <= 0 %}
        { action_raise_error("LENGTH is outside this tool's configured limit; SPEED must be greater than zero") }
    {% endif %}

    # home if necessary
    _CG28

    # select and park tool
    T{ TOOL }
    PARK_FRONT

    # set temperature
    {% if TEMP > 0 %}
        SET_TOOL_TEMPERATURE TOOL={ TOOL } ACTV_TMP={ TEMP } STDB_TMP={ TEMP } CHNG_STATE=2
        TEMPERATURE_WAIT_WITH_TOLERANCE TOOL={ TOOL } TOLERANCE=3
    {% elif not printer[printer['tool ' ~ TOOL].extruder].can_extrude %}
        { action_raise_error("cannot unload filament since the extruder is not hot") }
    {% endif %}

    SAVE_GCODE_STATE NAME=unload_filament
    M83 # set relative extrusion

    # Soften the tip without adding a large net extrusion before withdrawal.
    G1 E5.0 F{ filament.slow_speed * 60.0 }
    G1 E-5.0 F{ 20.0 * 60.0 }

    G1 E-{ unload_length } F{ unload_speed * 60.0 }
    M400 # wait for moves to finish

    # restore state
    RESTORE_GCODE_STATE NAME=unload_filament

[gcode_macro LOAD_FILAMENT]
description: Load filament into the selected tool
gcode:
    {% set filament = printer["gcode_macro _FILAMENT_SETTINGS"] %}
    {% set TOOL = params.TOOL|default(printer.toollock.tool_current)|int %}
    {% if TOOL < 0 or TOOL > 3 %}
        { action_raise_error("TOOL must be 0, 1, 2, or 3") }
    {% endif %}
    {% if ("tool " ~ TOOL) not in printer %}
        { action_raise_error("The selected tool is not connected and enabled") }
    {% endif %}
    {% set TEMP = params.TEMP|default(0)|int %}
    {% set max_move_length = filament.max_move_lengths[TOOL]|float %}
    {% set load_length = params.LENGTH|default(filament.load_lengths[TOOL])|float %}
    {% set purge_length = params.PURGE_LENGTH|default(filament.purge_length)|float %}
    {% set load_speed = params.SPEED|default(filament.load_speed)|float %}
    {% set purge_speed = params.PURGE_SPEED|default(filament.slow_speed)|float %}
    {% if load_length <= 0 or load_length > max_move_length %}
        { action_raise_error("LENGTH is outside this tool's configured limit") }
    {% endif %}
    {% if purge_length < 0 or purge_length > max_move_length or load_speed <= 0 or purge_speed <= 0 %}
        { action_raise_error("PURGE_LENGTH is outside this tool's configured limit; speeds must be greater than zero") }
    {% endif %}

    # set temperature
    RESPOND PREFIX="" MSG="Setting temperature for tool { TOOL } to { TEMP }C"
    {% if TEMP > 0 %}
        SET_TOOL_TEMPERATURE TOOL={ TOOL } ACTV_TMP={ TEMP } STDB_TMP={ TEMP } CHNG_STATE=2
        TEMPERATURE_WAIT_WITH_TOLERANCE TOOL={ TOOL } TOLERANCE=3
    {% elif not printer[printer['tool ' ~ TOOL].extruder].can_extrude %}
        { action_raise_error("cannot load filament since the extruder is not hot") }
    {% endif %}

    # home if necessary
    _CG28

    # select and park tool
    T{ TOOL }
    PARK_FRONT

    SAVE_GCODE_STATE NAME=load_filament
    M83 # set relative extrusion

    RESPOND PREFIX="" MSG="Loading filament into direct-drive tool { TOOL }..."
    # slow loading short distance
    G1 E{ filament.entry_length } F{ filament.slow_speed * 60.0 }

    G1 E{ load_length } F{ load_speed * 60.0 }
    M400 # wait for moves to finish

    # slow extrude
    {% if purge_length > 0 %}
        G1 E{ purge_length } F{ purge_speed * 60.0 }
    {% endif %}

    # set pressure advance if specified
    {% if params.PRESSURE_ADVANCE is defined %}
        {% set PA = params.PRESSURE_ADVANCE | float %}
        {% set smooth_time = "" %}
        {%if params.SMOOTH_TIME is defined %}
            {% set smooth_time = 'SMOOTH_TIME=' ~ params.SMOOTH_TIME %}
        {% endif %}
        KTCC_SET_TOOL_PRESSURE_ADVANCE TOOL={ TOOL } ADVANCE={ PA } { smooth_time }
        KTCC_SAVE_TOOL_PRESSURE_ADVANCE TOOL={ TOOL }
    {% endif %}

    # Set per-tool DDE retraction before the final G10.
    {% set retract = "" %}
    {% set retract_speed = "" %}
    {% set prime_speed = "" %}
    {% if params.RETRACT is defined %}
        {% set retract = 'LENGTH=' ~ params.RETRACT %}
    {% endif %}
    {% if params.RETRACT_SPEED is defined %}
        {% set retract_speed = 'SPEED=' ~ params.RETRACT_SPEED %}
    {% endif %}
    {% if params.PRIME_SPEED is defined %}
        {% set prime_speed = 'PRIME_SPEED=' ~ params.PRIME_SPEED %}
    {% endif %}
    {% if params.RETRACT is defined or params.RETRACT_SPEED is defined or params.PRIME_SPEED is defined %}
        KTCC_SET_TOOL_RETRACTION TOOL={ TOOL } { retract } { retract_speed } { prime_speed }
    {% endif %}

    G10
    M400

    # restore state
    RESTORE_GCODE_STATE NAME=load_filament

    RESPOND PREFIX="" MSG="Filament loaded for tool { TOOL }"
