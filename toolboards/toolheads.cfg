# Active per-tool hardware profile.
#
# T0/T1 retain their original backend, T2 uses CAN, and T3 remains disabled
# until its CAN board is physically connected. Enabling a tool here also
# requires enabling its logical tool references listed below.

# Shared CAN bridge (required while at least one CAN toolboard is enabled)
[include mcu.cfg]

# T0: original Duet2/DueX wiring
[include ../duet2/tool0.cfg]

# T1: original Duet2/DueX wiring
[include ../duet2/tool1.cfg]

# T2: first migrated CAN toolboard
[include tool2.cfg]

# T3: old Duet/DueX wiring has been removed. Enable this hardware line only
# after the CAN board is connected, then enable tool3.cfg in tools/tools.cfg.
# [include tool3.cfg]
