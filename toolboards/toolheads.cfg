# Active per-tool hardware profile.
#
# T0/T1 retain their original backend. T2/T3 are disabled until their CAN
# boards are physically connected. Enabling a tool here also requires enabling
# its logical tool definition in tools/tools.cfg.

# Shared CAN bridge: enable while at least one CAN toolboard is enabled.
# [include mcu.cfg]

# T0: Duet2 E0 motor/heater/sensor and Duet2 FAN1/FAN2
[include ../duet2/tool0.cfg]

# T1: Duet2 E1 motor/heater/sensor and DueX5 FAN3/FAN4
[include ../duet2/tool1.cfg]

# T2: enable together with ../tools/tool2.cfg after connecting its CAN board.
# [include tool2.cfg]

# T3: old DueX5 E3/FAN7/FAN8 wiring has been removed. Enable this line only
# after the CAN board is connected, then enable tool3.cfg in tools/tools.cfg.
# [include tool3.cfg]
