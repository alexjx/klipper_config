[extruder1]
step_pin: tool1:PD0
dir_pin: !tool1:PD1
enable_pin: !tool1:PD2
microsteps: 16
rotation_distance: 4.637
full_steps_per_rotation: 200
nozzle_diameter: 0.4
filament_diameter: 1.75
max_extrude_cross_section: 3.0
max_extrude_only_distance: 250.0
max_extrude_only_velocity: 100
max_extrude_only_accel: 8000
heater_pin: tool1:PA8
max_power: 1.0
sensor_type: PT1000
sensor_pin: tool1:PA0
pullup_resistor: 2200
control: pid
pid_Kp: 11.491
pid_Ki: 0.428
pid_Kd: 77.130
min_extrude_temp: 170
min_temp: -10
max_temp: 320

[verify_heater extruder1]
max_error: 120
check_gain_time: 30
hysteresis: 15
heating_gain: 2

[tmc2209 extruder1]
uart_pin: tool1:PA15
interpolate: True
run_current: 0.72
sense_resistor: 0.110

[heater_fan hotend_fan_1]
pin: tool1:PA6
heater: extruder1
heater_temp: 40.0
fan_speed: 1.0

[multi_pin tool1_part_fans]
pins: tool1:PA7, tool1:PB0

[fan_generic part_fan_1]
pin: multi_pin:tool1_part_fans
