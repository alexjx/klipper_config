# Toolboard placeholder UUIDs are deliberately valid-length values so this
# configuration can be parsed before the physical boards are available. Replace
# all four on the target printer; these values will not connect to real boards.

[mcu usb_bridge]
canbus_uuid: 28f4296c4844 # USB-CAN bridge
canbus_interface: can0

[mcu tool0]
canbus_uuid: 000000000002 # PLACEHOLDER: T0 toolboard
canbus_interface: can0

[mcu tool1]
canbus_uuid: 000000000003 # PLACEHOLDER: T1 toolboard
canbus_interface: can0

[mcu tool2]
canbus_uuid: 000000000004 # PLACEHOLDER: T2 toolboard
canbus_interface: can0

[mcu tool3]
canbus_uuid: 000000000005 # PLACEHOLDER: T3 toolboard
canbus_interface: can0
