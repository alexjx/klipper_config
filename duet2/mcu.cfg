[mcu]
serial: /dev/serial/by-id/usb-Klipper_sam4e8e_00323153434834523133303033303339-if00

[sx1509 duex]
i2c_address: 62 # Address is fixed on DueX boards

# Only aliases used by the active Duet2/DueX configuration are retained here.
# T0-T3 motors, heaters, sensors, and fans are defined exclusively in
# toolboards/tool0.cfg through toolboards/tool3.cfg.
[board_pins]
aliases:
    # Shared TMC2660 driver enable
    DRIVERS_EN=PC6,

    # Standard X driver, retained for the optional duet2/stepper_x.cfg profile
    X_DIR=PD11, X_STEP=PD6, X_ENDSTOP=PC14, X_CS=PD14,

    # Active Y and Z motion
    Y_DIR=PD12, Y_STEP=PD7, Y_ENDSTOP=PA2, Y_CS=PC9,
    Z_DIR=PD13, Z_STEP=PD8, Z_ENDSTOP=PD29, Z_CS=PC10,

    # Tool/alignment sensors on the Duet E0 and E1 endstop inputs
    E0_ENDSTOP=PD10,
    E1_ENDSTOP=PC16,

    # Coupler motor on the Duet/DueX E4 driver
    E4_DIR=PD16, E4_STEP=PD0, E4_CS=PD25,

    # Active X motor remapped to the E5 driver
    E5_DIR=PD17, E5_STEP=PD3, E5_CS=PD26,

    # Bed heater and temperature sensor
    HEADER_BED=PA19, HEADER_BED_SENSOR=PC13,

    # Repurposed outputs: E5 drives the controller fan; E6 drives the LED
    HEADER_E5=PC11,
    HEADER_E6=PA15,

    # Power-failure input
    PWR_FAIL_DET=PC4,
