[alignment]
pin: ^!E0_ENDSTOP

# Manual Tool Z Alignment System
# ================================
# This system provides a simple workflow for manually aligning tool Z offsets.
#
# Usage:
# 1. Run: MANUAL_Z_ALIGN TOOL=<0-3> TARGET=<z_height>
#    - Picks up the tool, moves to bed center at the target Z height
#    - Saves initial Z position for reference
#
# 2. Manually adjust Z using Z+/- buttons until nozzle is at correct height
#
# 3. Run: MANUAL_Z_ALIGN_SAVE
#    - Saves the current Z position after your adjustment
#
# 4. Run: MANUAL_Z_ALIGN_CALC
#    - Calculates offset adjustment and saves new tool offset
#
# Example:
#   MANUAL_Z_ALIGN TOOL=1 TARGET=0.15
#   (adjust Z using Z+/- buttons)
#   MANUAL_Z_ALIGN_SAVE
#   MANUAL_Z_ALIGN_CALC

[gcode_macro MANUAL_Z_ALIGN_SAVE]
description: Save current Z position for alignment calculation
gcode:
    {% set saved_tool_id = printer["gcode_macro MANUAL_Z_ALIGN_CALC"].saved_tool_id %}
    {% if saved_tool_id < 0 %}
        { action_raise_error("No alignment in progress. Please run MANUAL_Z_ALIGN first.") }
    {% endif %}

    # Save current Z position
    {% set current_z = printer.gcode_move.gcode_position.z %}
    SET_GCODE_VARIABLE MACRO=MANUAL_Z_ALIGN_CALC VARIABLE=saved_z_position VALUE={ current_z }

    RESPOND PREFIX="" MSG="Z position saved: { '%.4f'|format(current_z) } mm. Run MANUAL_Z_ALIGN_CALC to apply."

[gcode_macro MANUAL_Z_ALIGN_CALC]
description: Calculate and save new Z offset based on manual alignment
variable_saved_z_position: 0.0
variable_saved_tool_id: -1
gcode:
    {% if saved_tool_id < 0 %}
        { action_raise_error("No alignment data saved. Please run MANUAL_Z_ALIGN first.") }
    {% endif %}

    # Get current gcode position after user manual adjustment
    {% set current_z = printer.gcode_move.gcode_position.z %}

    # Calculate the adjustment made by user (inverted because lower Z = higher offset)
    {% set z_adjustment = saved_z_position - current_z %}

    # Get current tool offset from saved variables
    {% set current_offset = printer.save_variables.variables['ktcc_tool_offset_' ~ saved_tool_id] %}
    {% set current_z_offset = current_offset[2] %}

    # Calculate new Z offset
    {% set new_z_offset = current_z_offset + z_adjustment %}

    # Set and save new offset using KTCC commands
    SET_TOOL_OFFSET TOOL={ saved_tool_id } Z={ new_z_offset }
    KTCC_SAVE_TOOL_OFFSET TOOL={ saved_tool_id }

    # Display calculation (in reverse order for correct console output)
    RESPOND PREFIX="" MSG="New offset set and saved successfully!"
    RESPOND PREFIX="" MSG="======================================"
    RESPOND PREFIX="" MSG="New tool Z offset: { '%.4f'|format(new_z_offset) } mm"
    RESPOND PREFIX="" MSG="Previous tool Z offset: { '%.4f'|format(current_z_offset) } mm"
    RESPOND PREFIX="" MSG="Z offset adjustment: { '%.4f'|format(z_adjustment) } mm"
    RESPOND PREFIX="" MSG="Current Z position: { '%.4f'|format(current_z) } mm"
    RESPOND PREFIX="" MSG="Initial Z position: { '%.4f'|format(saved_z_position) } mm"
    RESPOND PREFIX="" MSG="Tool: { saved_tool_id }"
    RESPOND PREFIX="" MSG="=== Manual Z Alignment Calculation ==="

    # Clear saved data
    SET_GCODE_VARIABLE MACRO=MANUAL_Z_ALIGN_CALC VARIABLE=saved_z_position VALUE=0.0
    SET_GCODE_VARIABLE MACRO=MANUAL_Z_ALIGN_CALC VARIABLE=saved_tool_id VALUE=-1
    DROP_TOOL

[gcode_macro MANUAL_Z_ALIGN_CANCEL]
description: Cancel manual Z alignment without changing the tool offset
gcode:
    {% set current_tool = printer['toollock'].tool_current | int %}

    # Discard the in-progress measurement before releasing the tool.
    SET_GCODE_VARIABLE MACRO=MANUAL_Z_ALIGN_CALC VARIABLE=saved_z_position VALUE=0.0
    SET_GCODE_VARIABLE MACRO=MANUAL_Z_ALIGN_CALC VARIABLE=saved_tool_id VALUE=-1

    {% if current_tool >= 0 %}
        DROP_TOOL
    {% endif %}

    RESPOND PREFIX="" MSG="Manual Z alignment cancelled"

[gcode_macro MANUAL_Z_ALIGN]
description: Manual tool Z alignment procedure
gcode:
    {% set tool_id = params.TOOL|default(-1)|int %}
    {% set target_z = params.TARGET|default(0.15)|float %}

    {% if tool_id < 0 or tool_id > 3 %}
        { action_raise_error("Invalid TOOL parameter. Must be 0-3.") }
    {% endif %}

    RESPOND PREFIX="" MSG="Target Z: { target_z } mm"
    RESPOND PREFIX="" MSG="Tool: { tool_id }"
    RESPOND PREFIX="" MSG="=== Starting Manual Z Alignment ==="

    # Step 1: Home if not already homed
    _CG28

    # Step 2: Pick up the target tool
    T{ tool_id }

    # Step 3: Move to bed center
    PARK_CENTER

    # Step 4: Move to target Z offset
    G0 Z{ target_z } F{ 60 * 2 }

    # Step 5: Save current gcode position Z
    M400 # wait for moves to finish
    # save current tool id to indicate alignment in progress
    SET_GCODE_VARIABLE MACRO=MANUAL_Z_ALIGN_CALC VARIABLE=saved_tool_id VALUE={ tool_id }
    MANUAL_Z_ALIGN_SAVE

    RESPOND PREFIX="" MSG="======================================"
    RESPOND PREFIX="" MSG="2. MANUAL_Z_ALIGN_CALC to save offset"
    RESPOND PREFIX="" MSG="1. Adjust Z with Z+/- buttons, then:"
    RESPOND PREFIX="" MSG="======================================"

[gcode_macro ALIGN_TOOLS]
description: Aligns the tool to the probe
gcode:
    {% set TOOLS = params.TOOLS|default("0,1,2,3") %}
    {% set SAMPLES = params.SAMPLES|default(3)|int %}
    {% set RETRIES = params.RETRIES|default(3)|int %}
    {% set TOLERANCE = params.TOLERANCE|default(0.02)|float %}
    {% set SAVE = params.SAVE|default(1)|abs %}

    # changing this will invalid previous calibration
    {% set PROBE_POINT = "144,101" %}
    {% set remember_position = printer['gcode_macro _SETTINGS'].remember_position %}

    _CG28

    # we must disable the position remembering since it will mess up the alignment
    SET_GCODE_VARIABLE MACRO=_SETTINGS VARIABLE=remember_position VALUE=0
    KTCC_ALIGN_TOOLS TOOLS={ TOOLS } PROBE_POINT={ PROBE_POINT } SAMPLES={ SAMPLES } RETRIES={ RETRIES } TOLERANCE={ TOLERANCE } SAVE={ SAVE }
    SET_GCODE_VARIABLE MACRO=_SETTINGS VARIABLE=remember_position VALUE={ remember_position }

[gcode_macro SET_ALL_TOOL_TEMPERATURE]
description: Prepares the tool for alignment
gcode:
    {% set temperature = params.TEMP|int %}

    SET_TOOL_TEMPERATURE TOOL=0 STDB_TMP={ temperature } ACTV_TMP={ temperature } CHNG_STATE=2 STDB_TIMEOUT=7200 SHTDWN_TIMEOUT=7200
    SET_TOOL_TEMPERATURE TOOL=1 STDB_TMP={ temperature } ACTV_TMP={ temperature } CHNG_STATE=2 STDB_TIMEOUT=7200 SHTDWN_TIMEOUT=7200
    SET_TOOL_TEMPERATURE TOOL=2 STDB_TMP={ temperature } ACTV_TMP={ temperature } CHNG_STATE=2 STDB_TIMEOUT=7200 SHTDWN_TIMEOUT=7200
    SET_TOOL_TEMPERATURE TOOL=3 STDB_TMP={ temperature } ACTV_TMP={ temperature } CHNG_STATE=2 STDB_TIMEOUT=7200 SHTDWN_TIMEOUT=7200
