[alignment]
pin: ^!E0_ENDSTOP

# Manual Tool Z Alignment System
# ================================
# A staged workflow keeps an unknown-length nozzle away from the bed until the
# operator deliberately approaches it. The screen owns the guide; these macros
# own motion validation, recoverable state, offset persistence, and tool drop.
#
# Stage values:
#   0 idle, 1 preparing, 2 coarse approach, 3 fine alignment,
#   4 applying, 5 cancelling

[gcode_macro _MANUAL_Z_ALIGN_STATE]
description: Internal state for staged manual tool Z alignment
variable_stage: 0
variable_tool_id: -1
variable_target_z: 0.15
variable_safe_z: 20.0
variable_original_z_offset: 0.0
variable_coarse_start_z: 0.0
variable_fine_start_z: 0.0
variable_max_adjustment: 15.0
gcode:
    RESPOND PREFIX="" MSG="Manual Z stage={ stage } tool={ tool_id } target={ '%.3f'|format(target_z) } safe={ '%.1f'|format(safe_z) }"

[gcode_macro _MANUAL_Z_ALIGN_CLEAR]
description: Internal helper to clear staged manual Z alignment state
gcode:
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=stage VALUE=0
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=tool_id VALUE=-1
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=target_z VALUE=0.15
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=safe_z VALUE=20.0
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=original_z_offset VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=coarse_start_z VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=fine_start_z VALUE=0.0
    SET_GCODE_VARIABLE MACRO=MANUAL_Z_ALIGN_CALC VARIABLE=saved_z_position VALUE=0.0
    SET_GCODE_VARIABLE MACRO=MANUAL_Z_ALIGN_CALC VARIABLE=saved_tool_id VALUE=-1

[gcode_macro MANUAL_Z_ALIGN_PREPARE]
description: Safely prepare a tool for staged manual Z alignment
gcode:
    {% set state = printer["gcode_macro _MANUAL_Z_ALIGN_STATE"] %}
    {% set tool_id = params.TOOL|default(-1)|int %}
    {% set target_z = params.TARGET|default(0.15)|float %}
    {% set safe_z = params.SAFE_Z|default(20.0)|float %}
    {% set current_tool = printer.toollock.tool_current|int %}
    {% set changer_mode = printer.toollock.changer_mode|string|upper %}
    {% set print_state = printer.print_stats.state|string|lower %}

    {% if state.stage|int != 0 %}
        { action_raise_error("Manual Z alignment is already active.") }
    {% endif %}
    {% if print_state in ("printing", "paused") %}
        { action_raise_error("Manual Z alignment is unavailable during a print.") }
    {% endif %}
    {% if changer_mode != "IDLE" %}
        { action_raise_error("Tool changer must be idle.") }
    {% endif %}
    {% if current_tool != -1 %}
        { action_raise_error("Drop the mounted tool before starting Manual Z alignment.") }
    {% endif %}
    {% if tool_id < 0 or tool_id > 3 %}
        { action_raise_error("Invalid TOOL parameter. Must be 0-3.") }
    {% endif %}
    {% if ("tool " ~ tool_id) not in printer %}
        { action_raise_error("T" ~ tool_id ~ " is disabled; connect and enable its hardware first.") }
    {% endif %}
    {% if target_z < -1.0 or target_z > 2.0 %}
        { action_raise_error("TARGET must be between -1.0 and 2.0 mm.") }
    {% endif %}
    {% if safe_z < 5.0 or safe_z > 50.0 %}
        { action_raise_error("SAFE_Z must be between 5.0 and 50.0 mm.") }
    {% endif %}

    {% set original_z_offset = printer["tool " ~ tool_id].offset[2]|float %}
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=stage VALUE=1
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=tool_id VALUE={ tool_id }
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=target_z VALUE={ target_z }
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=safe_z VALUE={ safe_z }
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=original_z_offset VALUE={ original_z_offset }
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=coarse_start_z VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=fine_start_z VALUE=0.0

    # Establish a known no-tool coordinate system and lift before pickup.
    _CG28
    BED_MESH_CLEAR
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G90
    G0 Z{ safe_z } F600

    # Tool pickup applies its saved offset without moving Z. PARK_CENTER moves
    # only XY because all axes were homed above, preserving physical clearance.
    T{ tool_id }
    PARK_CENTER
    M400
    _MANUAL_Z_ALIGN_PREPARE_FINISH TOOL={ tool_id }

[gcode_macro _MANUAL_Z_ALIGN_PREPARE_FINISH]
description: Internal completion step for Manual Z preparation
gcode:
    {% set state = printer["gcode_macro _MANUAL_Z_ALIGN_STATE"] %}
    {% set tool_id = params.TOOL|default(-1)|int %}
    {% set current_tool = printer.toollock.tool_current|int %}
    {% if state.stage|int != 1 or tool_id != state.tool_id|int %}
        { action_raise_error("Manual Z preparation state mismatch.") }
    {% endif %}
    {% if current_tool != tool_id %}
        { action_raise_error("Selected tool was not mounted during Manual Z preparation.") }
    {% endif %}
    {% if printer.toollock.changer_mode|string|upper != "IDLE" %}
        { action_raise_error("Tool changer did not return to idle.") }
    {% endif %}

    {% set current_z = printer.gcode_move.gcode_position.z|float %}
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=coarse_start_z VALUE={ current_z }
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=stage VALUE=2

    # Mirror the legacy fields until every display client uses the staged state.
    SET_GCODE_VARIABLE MACRO=MANUAL_Z_ALIGN_CALC VARIABLE=saved_z_position VALUE={ state.target_z }
    SET_GCODE_VARIABLE MACRO=MANUAL_Z_ALIGN_CALC VARIABLE=saved_tool_id VALUE={ tool_id }
    RESPOND PREFIX="" MSG="T{ tool_id } prepared at a safe height. Approach the bed, then run MANUAL_Z_ALIGN_BEGIN."

[gcode_macro _MANUAL_Z_ALIGN_JOG]
description: Internal validated Z jog for staged manual alignment
gcode:
    {% set state = printer["gcode_macro _MANUAL_Z_ALIGN_STATE"] %}
    {% set stage = state.stage|int %}
    {% if params.DELTA is not defined %}
        { action_raise_error("DELTA is required.") }
    {% endif %}
    {% set delta = params.DELTA|default(0.0)|float %}
    {% set magnitude = delta|abs %}
    {% set current_z = printer.gcode_move.gcode_position.z|float %}
    {% set next_z = current_z + delta %}
    {% set minimum_z = (state.target_z|float) - (state.max_adjustment|float) %}

    {% if stage not in (2, 3) %}
        { action_raise_error("Manual Z jog is only available during coarse or fine alignment.") }
    {% endif %}
    {% if printer.toollock.tool_current|int != state.tool_id|int %}
        { action_raise_error("Mounted tool does not match the Manual Z alignment tool.") }
    {% endif %}
    {% if printer.toollock.changer_mode|string|upper != "IDLE" %}
        { action_raise_error("Tool changer must be idle.") }
    {% endif %}
    {% if "xyz" != printer.toolhead.homed_axes %}
        { action_raise_error("XYZ must remain homed during Manual Z alignment.") }
    {% endif %}
    {% if stage == 2 and not (magnitude > 0.099 and magnitude < 0.101
                              or magnitude > 0.499 and magnitude < 0.501
                              or magnitude > 0.999 and magnitude < 1.001) %}
        { action_raise_error("Coarse Manual Z step must be 0.10, 0.50, or 1.00 mm.") }
    {% endif %}
    {% if stage == 3 and not (magnitude > 0.009 and magnitude < 0.011
                              or magnitude > 0.049 and magnitude < 0.051
                              or magnitude > 0.099 and magnitude < 0.101) %}
        { action_raise_error("Fine Manual Z step must be 0.01, 0.05, or 0.10 mm.") }
    {% endif %}
    {% if stage == 2 and (next_z < minimum_z or next_z > (state.coarse_start_z|float) + 2.0) %}
        { action_raise_error("Coarse Manual Z move exceeds the guided range.") }
    {% endif %}
    {% if stage == 3 and (next_z < (state.fine_start_z|float) - 2.0 or next_z > (state.fine_start_z|float) + 2.0) %}
        { action_raise_error("Fine Manual Z move exceeds +/-2.0 mm from its start.") }
    {% endif %}

    SAVE_GCODE_STATE NAME=manual_z_align_jog
    G91
    G0 Z{ delta } F120
    M400
    RESTORE_GCODE_STATE NAME=manual_z_align_jog

[gcode_macro MANUAL_Z_ALIGN_BEGIN]
description: Begin fine adjustment after the coarse Manual Z approach
gcode:
    {% set state = printer["gcode_macro _MANUAL_Z_ALIGN_STATE"] %}
    {% if state.stage|int != 2 %}
        { action_raise_error("Manual Z alignment is not ready to begin fine adjustment.") }
    {% endif %}
    {% if printer.toollock.tool_current|int != state.tool_id|int %}
        { action_raise_error("Mounted tool does not match the Manual Z alignment tool.") }
    {% endif %}
    {% if printer.toollock.changer_mode|string|upper != "IDLE" %}
        { action_raise_error("Tool changer must be idle.") }
    {% endif %}

    M400
    _MANUAL_Z_ALIGN_BEGIN_FINISH

[gcode_macro _MANUAL_Z_ALIGN_BEGIN_FINISH]
description: Internal completion step for Manual Z fine adjustment
gcode:
    {% set state = printer["gcode_macro _MANUAL_Z_ALIGN_STATE"] %}
    {% if state.stage|int != 2 %}
        { action_raise_error("Manual Z fine-adjustment state mismatch.") }
    {% endif %}
    {% set current_z = printer.gcode_move.gcode_position.z|float %}
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=fine_start_z VALUE={ current_z }
    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=stage VALUE=3
    RESPOND PREFIX="" MSG="Fine Manual Z adjustment started at { '%.3f'|format(current_z) } mm."

[gcode_macro MANUAL_Z_ALIGN_SAVE]
description: Compatibility alias that begins fine Manual Z adjustment
gcode:
    MANUAL_Z_ALIGN_BEGIN

[gcode_macro MANUAL_Z_ALIGN_CALC]
description: Drop the tool, calculate, and persist its Manual Z offset
variable_saved_z_position: 0.0
variable_saved_tool_id: -1
gcode:
    {% set state = printer["gcode_macro _MANUAL_Z_ALIGN_STATE"] %}
    {% set stage = state.stage|int %}
    {% set tool_id = state.tool_id|int %}
    {% set current_tool = printer.toollock.tool_current|int %}
    {% if stage not in (2, 3) or tool_id < 0 %}
        { action_raise_error("No Manual Z alignment is ready to save.") }
    {% endif %}
    {% if current_tool != tool_id %}
        { action_raise_error("Mounted tool does not match the Manual Z alignment tool.") }
    {% endif %}
    {% if printer.toollock.changer_mode|string|upper != "IDLE" %}
        { action_raise_error("Tool changer must be idle.") }
    {% endif %}

    {% set current_z = printer.gcode_move.gcode_position.z|float %}
    {% set z_adjustment = (state.target_z|float) - current_z %}
    {% if z_adjustment|abs > state.max_adjustment|float %}
        { action_raise_error("Manual Z adjustment exceeds the configured safety limit.") }
    {% endif %}
    {% set new_z_offset = (state.original_z_offset|float) + z_adjustment %}

    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=stage VALUE=4
    M400

    # Drop while the old offset is still active. Only persist the new offset
    # after a successful drop, then clear the recoverable workflow state.
    DROP_TOOL
    SET_TOOL_OFFSET TOOL={ tool_id } Z={ new_z_offset }
    KTCC_SAVE_TOOL_OFFSET TOOL={ tool_id }
    _MANUAL_Z_ALIGN_CLEAR

    RESPOND PREFIX="" MSG="Manual Z alignment saved for T{ tool_id }: { '%.4f'|format(state.original_z_offset|float) } -> { '%.4f'|format(new_z_offset) } mm"

[gcode_macro MANUAL_Z_ALIGN_CANCEL]
description: Cancel Manual Z alignment without changing the tool offset
gcode:
    {% set state = printer["gcode_macro _MANUAL_Z_ALIGN_STATE"] %}
    {% set stage = state.stage|int %}
    {% set tool_id = state.tool_id|int %}
    {% set current_tool = printer.toollock.tool_current|int %}
    {% if stage == 0 %}
        { action_raise_error("No Manual Z alignment is active.") }
    {% endif %}
    {% if current_tool == -2 %}
        { action_raise_error("Mounted tool state is unknown; use ToolChanger recovery.") }
    {% endif %}
    {% if current_tool >= 0 and current_tool != tool_id %}
        { action_raise_error("Mounted tool does not match the Manual Z alignment tool.") }
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_MANUAL_Z_ALIGN_STATE VARIABLE=stage VALUE=5
    M400
    {% if current_tool >= 0 %}
        DROP_TOOL
    {% endif %}
    _MANUAL_Z_ALIGN_CLEAR
    RESPOND PREFIX="" MSG="Manual Z alignment cancelled"

[gcode_macro MANUAL_Z_ALIGN]
description: Compatibility entry for safe staged Manual Z alignment
gcode:
    {% set tool_id = params.TOOL|default(-1)|int %}
    {% set target_z = params.TARGET|default(0.15)|float %}
    {% set safe_z = params.SAFE_Z|default(20.0)|float %}
    MANUAL_Z_ALIGN_PREPARE TOOL={ tool_id } TARGET={ target_z } SAFE_Z={ safe_z }

[gcode_macro ALIGN_TOOLS]
description: Aligns the tool to the probe
gcode:
    {% set default_tools = "0,1" %}
    {% if "tool 2" in printer %}
        {% set default_tools = default_tools ~ ",2" %}
    {% endif %}
    {% if "tool 3" in printer %}
        {% set default_tools = default_tools ~ ",3" %}
    {% endif %}
    {% set TOOLS = params.TOOLS|default(default_tools) %}
    {% set SAMPLES = params.SAMPLES|default(3)|int %}
    {% set RETRIES = params.RETRIES|default(3)|int %}
    {% set TOLERANCE = params.TOLERANCE|default(0.02)|float %}
    {% set SAVE = params.SAVE|default(1)|abs %}

    # changing this will invalid previous calibration
    {% set PROBE_POINT = "144,101" %}
    {% set remember_position = printer['gcode_macro _SETTINGS'].remember_position %}

    _CG28

    # we must disable the position remembering since it will mess up the alignment
    SET_GCODE_VARIABLE MACRO=_SETTINGS VARIABLE=remember_position VALUE=0
    KTCC_ALIGN_TOOLS TOOLS={ TOOLS } PROBE_POINT={ PROBE_POINT } SAMPLES={ SAMPLES } RETRIES={ RETRIES } TOLERANCE={ TOLERANCE } SAVE={ SAVE }
    SET_GCODE_VARIABLE MACRO=_SETTINGS VARIABLE=remember_position VALUE={ remember_position }

[gcode_macro SET_ALL_TOOL_TEMPERATURE]
description: Prepares the tool for alignment
gcode:
    {% set temperature = params.TEMP|int %}

    SET_TOOL_TEMPERATURE TOOL=0 STDB_TMP={ temperature } ACTV_TMP={ temperature } CHNG_STATE=2 STDB_TIMEOUT=7200 SHTDWN_TIMEOUT=7200
    SET_TOOL_TEMPERATURE TOOL=1 STDB_TMP={ temperature } ACTV_TMP={ temperature } CHNG_STATE=2 STDB_TIMEOUT=7200 SHTDWN_TIMEOUT=7200
    {% if "tool 2" in printer %}
        SET_TOOL_TEMPERATURE TOOL=2 STDB_TMP={ temperature } ACTV_TMP={ temperature } CHNG_STATE=2 STDB_TIMEOUT=7200 SHTDWN_TIMEOUT=7200
    {% endif %}
    {% if "tool 3" in printer %}
        SET_TOOL_TEMPERATURE TOOL=3 STDB_TMP={ temperature } ACTV_TMP={ temperature } CHNG_STATE=2 STDB_TIMEOUT=7200 SHTDWN_TIMEOUT=7200
    {% endif %}
