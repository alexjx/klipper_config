# T1: Legacy Duet2/DueX hardware and logical tool settings.
[extruder1]
step_pin: E1_STEP
dir_pin: !E1_DIR
enable_pin: !DRIVERS_EN
microsteps: 16
rotation_distance: 8.672
full_steps_per_rotation: 200
nozzle_diameter: 0.4
filament_diameter: 1.75
max_extrude_cross_section: 3.0
max_extrude_only_distance: 1000.0
max_extrude_only_velocity: 100
max_extrude_only_accel: 8000
heater_pin: !HEADER_E1
max_power: 1.0
sensor_type: PT1000
sensor_pin: HEADER_E1_SENSOR
pullup_resistor: 4700
control: pid
pid_Kp: 11.491
pid_Ki: 0.428
pid_Kd: 77.130
pwm_cycle_time: 0.001
min_extrude_temp: 170
min_temp: -10
max_temp: 320

[verify_heater extruder1]
max_error: 120
check_gain_time: 30
hysteresis: 15
heating_gain: 2

[tmc2660 extruder1]
cs_pin: E1_CS
spi_bus: usart1
interpolate: True
run_current: 1.1
sense_resistor: 0.051
idle_current_percent: 30

[heater_fan hotend_fan_1]
pin: sx1509_duex:PIN_12
heater: extruder1
heater_temp: 40.0
fan_speed: 1.0
hardware_pwm: True

[fan_generic part_fan_1]
pin: sx1509_duex:PIN_7
hardware_pwm: True

[tool 1]
tool_group: 0
extruder: extruder1
fan: part_fan_1
meltzonelength: 25
zone: 78.0, 200.0, 0.0
park: 78.0, 239.5, 0.0
offset: 0.0, -39.0, 10.0
shaper_freq_x: 67.4
shaper_type_x: mzv
shaper_damping_ratio_x: 0.075
shaper_freq_y: 48.8
shaper_type_y: mzv
shaper_damping_ratio_y: 0.033
